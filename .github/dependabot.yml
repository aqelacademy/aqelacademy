version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # eslint-config-next's plugins don't support ESLint 10 or TypeScript 7 yet (peer ranges).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Types follow the Node version pinned in .nvmrc.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Next 16.4 breaks the Worker with OpenNext 1.20.9 ("Unexpected loadManifest(preview-props.json)",
      # every page 500, 2026-10-11). Lift once an OpenNext release supports it and `npm run preview` passes.
      - dependency-name: next
        versions: [">=16.4.0"]
      - dependency-name: eslint-config-next
        versions: [">=16.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
